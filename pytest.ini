[pytest]
testpaths = tests
pythonpath = .
addopts = -v

# Logs en consola durante la ejecución
log_cli = true
log_cli_level = INFO

# Logs guardados en archivo (evidencia de ejecución)
log_file = reports/ejecucion.log
log_file_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S